name: Deploy to TestFlight

on:
  push:
    branches:
      - main
      - theosementa/github-action # TODO: remove after testing the workflow
  workflow_dispatch: {}

jobs:
  beta:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure git for private SPM dependencies
        env:
          SPM_DEPENDENCIES_TOKEN: ${{ secrets.SPM_DEPENDENCIES_TOKEN }}
        run: git config --global url."https://x-access-token:${SPM_DEPENDENCIES_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project BlackJack-swift.xcodeproj -scheme BlackJack-swift

      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane beta
